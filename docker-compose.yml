services:
  payments-service:
    build:
      context: .
      dockerfile: payments-service/dockerfile
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      DB_HOST: payments-db
      DB_PORT: 5432
      DB_USER: ${PAYMENTS_DB_USER}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      DB_NAME: ${PAYMENTS_DB_NAME}
      PORT: 8080
      GRPC_PORT: 9090
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: payments
    depends_on:
      payments-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - payflow-network

  payments-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
    volumes:
      - payments-db-data:/var/lib/postgresql/data
      - ./payments-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network

  ledger-service:
    build:
      context: ./ledger-service
    environment:
      DB_HOST: ledger-db
      DB_PORT: 5432
      DB_USER: ${LEDGER_DB_USER}
      DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      DB_NAME: ${LEDGER_DB_NAME}
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: payments
      KAFKA_GROUP: ledger-service
    depends_on:
      ledger-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - payflow-network

  ledger-db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${LEDGER_DB_USER}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD}
      POSTGRES_DB: ${LEDGER_DB_NAME}
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
      - ./ledger-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_DB_USER} -d ${LEDGER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - payflow-network

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--create", "--if-not-exists", "--bootstrap-server", "kafka:9092", "--topic", "payments", "--partitions", "1", "--replication-factor", "1"]
    networks:
      - payflow-network

volumes:
  payments-db-data:
  ledger-db-data:

networks:
  payflow-network: