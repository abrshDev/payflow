services:
  payments-service:
    build:
      context: ./payments-service
    ports:
      - "8081:8080"   # host:container — 8081 on your machine, still 8080 inside the container
    environment:
      DB_HOST: payments-db
      DB_PORT: 5432
      DB_USER: ${PAYMENTS_DB_USER}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      DB_NAME: ${PAYMENTS_DB_NAME}
      PORT: 8080
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: payments
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payflow-network

  payments-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
    volumes:
      - payments-db-data:/var/lib/postgresql/data
      - ./payments-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - payflow-network

volumes:
  payments-db-data:

networks:
  payflow-network: